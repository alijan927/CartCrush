<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - CartCrush</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="form-card">
    <h2 style="text-align: center; margin-bottom: 1.5rem;">Admin Login</h2>
    <form id="loginForm">
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="username" required placeholder="admin">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn" style="width:100%;">Login</button>
      <div id="errorMsg" style="color:red; margin-top:10px; text-align:center;"></div>
    </form>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
