<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CartCrush - Online Shopping Store</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navbar Navigation -->
  <nav class="navbar">
    <h2><a href="home.html" style="color: inherit; text-decoration: none;">CartCrush</a></h2>
    
    <div class="nav-controls">
      <a href="home.html" class="nav-link active">Home</a>
      <a href="checkout.html" class="nav-link">
        Cart (<span id="cart-count">0</span>)
      </a>
      <a href="my-orders.html" class="nav-link">Track Order</a>
    </div>
  </nav>

  <!-- Hero Banner Section -->
  <section class="hero-banner">
    <div class="hero-bg-overlay"></div>

    <div class="hero-content">
      <h1>Welcome to <span class="brand-highlight">CartCrush</span></h1>
      <p class="hero-description">
        Discover top-quality electronics, trending accessories, and everyday essentials all in one place. Enjoy unbeatable prices, fast delivery, and a seamless shopping experience tailored just for you.
      </p>
      <a href="#products-section" class="btn hero-btn">Explore Products ↓</a>
    </div>
  </section>

  <!-- Main Products Container -->
  <div class="container" id="products-section" style="max-width: 1200px; margin: 2rem auto; padding: 0 1rem;">
    
    <!-- Section Heading -->
    <h1 style="color: color(srgb red green blue); text-align: center; margin-bottom: 1.5rem; font-weight: bold;">ALL PRODUCTS</h1>

    <!-- 🔍 Search Bar (Directly below Featured Products) -->
    <div class="search-wrapper" style="margin-bottom: 2rem;">
      <input 
        type="text" 
        id="searchInput" 
        placeholder="Search products by name..." 
        style="width: 100%; padding: 12px 16px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 1rem; outline: none; box-sizing: border-box;"
      />
    </div>

    <!-- 🛍️ Horizontal 4 Products Grid -->
    <div id="productsContainer" class="products-grid"></div>

  </div>

  <div id="toast-container"></div>

  <script src="js/home.js"></script>
</body>
</html>
