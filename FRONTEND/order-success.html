<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CartCrush - Order Placed Successfully</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navbar Navigation -->
  <nav class="navbar">
    <h2><a href="home.html" style="color: inherit; text-decoration: none;">CartCrush</a></h2>
    <div class="nav-controls">
      <a href="home.html" class="nav-link">Home</a>
      <a href="my-orders.html" class="nav-link">Track Order</a>
    </div>
  </nav>

  <!-- Success Card Container -->
  <div class="success-container">
    <div class="success-card">
      
      <!-- Success Icon -->
      <div class="success-icon">🎉</div>
      
      <h2>Order Placed Successfully!</h2>
      <p>Your order has been received. Please save/copy the Order ID provided below to track your order.</p>

      <!-- Copy Order ID Input Box -->
      <div class="copy-id-box">
        <input 
          type="text" 
          id="successOrderId" 
          class="copy-id-input"
          readonly 
          value="Loading..."
        >
        <button 
          id="copyBtn" 
          onclick="copyOrderId()" 
          class="copy-btn" 
        >
          📋 Copy ID
        </button>
      </div>

      <!-- Action Buttons -->
      <div class="action-buttons-group">
        <a href="my-orders.html" id="trackNowBtn" class="action-btn-primary">
          Track This Order ➔
        </a>
        <a href="home.html" class="action-btn-secondary">
          Continue Shopping
        </a>
      </div>

    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // URL query params se orderId get kar rahe hain
      const urlParams = new URLSearchParams(window.location.search);
      const orderId = urlParams.get('orderId') || 'N/A';

      const input = document.getElementById('successOrderId');
      const trackBtn = document.getElementById('trackNowBtn');

      if (input) input.value = orderId;
      if (trackBtn && orderId !== 'N/A') {
        trackBtn.href = `my-orders.html?orderId=${encodeURIComponent(orderId)}`;
      }
    });

    function copyOrderId() {
      const input = document.getElementById('successOrderId');
      const btn = document.getElementById('copyBtn');

      if (!input || !input.value || input.value === 'Loading...' || input.value === 'N/A') return;

      input.select();
      input.setSelectionRange(0, 99999); // Mobile compatibility

      navigator.clipboard.writeText(input.value).then(() => {
        btn.textContent = '✅ Copied!';
        btn.style.background = '#10b981';

        setTimeout(() => {
          btn.textContent = '📋 Copy ID';
          btn.style.background = '';
        }, 2000);
      }).catch(err => {
        console.error('Copy failed:', err);
      });
    }
  </script>
</body>
</html>
